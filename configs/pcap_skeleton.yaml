# Skeleton-only fast-iter 入口。配 curriculum_pcap_skeleton.yaml。
# 跑训练:python scripts/remote.py start python scripts/train.py --config configs/pcap_skeleton.yaml
base: qwen3.5-0.8b.yaml

curriculum_file: curriculum_pcap_skeleton.yaml

state:
  n_persistent_per_layer: 4

training:
  grad_accum_steps: 4
  dtype: bfloat16
  compile_backbone_layers: true

stage_overrides:
  pcap_skeleton:
    learning_rate: 7.0e-5
    warmup_steps: 100
    weight_decay: 0.1
    batch_size: 1
    grad_accum_steps: 2
    turn_max_tokens: 768
    max_turns_per_episode: 16
    tbptt_turns: 8
    value_weight_cap: 5.0
    max_steps: 1200
    # NM-only aux loss。mem_out 过 frozen lm_head 预测 value token,
    # 逼记忆通路学 key→value 映射。0 关,~0.5 跟主 loss 等权。
    nm_aux_weight: 0.5
