# Xinhe 默认配置;切换 backbone 用 --config

backbone:
  type: "qwen"
  model_path: "./models/qwen3.5-0.8b"
  weights_path: ""
  hidden_size: 1024
  freeze: true

# 单全局 QueryHead + HippoDelta 架构:具体 d_key / d_value / n_query 等
# 在派生入口(pcap_delta.yaml 等)显式设置。
state:
  n_heads: 16
  head_dim: 64                    # d_total = 16*64 = 1024 = hidden_size

# v9.5 LoRA(frozen backbone 适配 MAC OOD 输入的根因修复,与 NM/MAC 协同)
# qkvo,rank=16/alpha=32,零初始化保证启动期 frozen backbone 行为不变。
# stage 可在 stage_overrides 内 override。
lora:
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]



# turn_max_tokens / max_turns_per_episode / tbptt_turns 必须 per-stage 显式给
training:
  batch_size: 1
  learning_rate: 3.0e-4
  weight_decay: 0.01
  grad_clip: 1.0
  grad_accum_steps: 1
  gradient_checkpointing: false
  warmup_steps: 100
  max_steps: 10000
  eval_every: 1000
  save_every: 1000
  log_every: 50
  device: "cuda"
  dtype: "bfloat16"

data:
  train_path: "./data/train.jsonl"
  val_path: "./data/val.jsonl"

logging:
  use_wandb: false
  project: "xinhe"
  run_name: null
