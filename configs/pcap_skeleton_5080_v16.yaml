# v16 cross-attention NM(D 路径)— softmax retrieval 替代 HippoDelta 线性求和
#
# v11-v15 全 read=0%。诊断:HippoDelta `r = M @ q^T` 在多 distractor 时
# r ≈ mean(V_i) 把 target 信号淹了(无 softmax 选择)。
#
# v16 改 cross-attention:
#   - state = explicit (K, V) buffer(max_slots=32)
#   - write: pool turn hidden → K/V → append
#   - retrieve: softmax(q · K^T · sqrt(d_key)) · V — soft-argmax 选最像 1 个
#
# 配合 v15 的 backbone-aware query(query 层 0,经 backbone 加工后语义对齐 K)
# 配合 v14 的 mal_alpha=0(50% inject 让 NM 主导 read first-token)
base: qwen3.5-0.8b.yaml
curriculum_file: curriculum_pcap_skeleton_gen_v11.yaml

state:
  n_persistent_per_layer: 0
  mal_alpha_init: 0.0
  query_pool: "mean"
  query_source_layer: 0          # v15 layer 2 反而慢且无效;v16 回 0,让 NM retrieve 来做语义
  mem_type: "cross_attn"          # ★ D 路径:softmax retrieval
  mem_max_slots: 32               # buffer 容 32 个 (K,V) entry(skeleton 8-turn 充裕)
  mem_write_pool: "mean"          # write 池化 turn tokens

lora:
  rank: 4

training:
  grad_accum_steps: 4
  dtype: bfloat16
  compile_backbone_layers: false

stage_overrides:
  pcap_skeleton:
    learning_rate: 3.0e-4
    warmup_steps: 100
    weight_decay: 0.1
    batch_size: 1
    grad_accum_steps: 2
    turn_max_tokens: 256
    max_turns_per_episode: 8
    tbptt_turns: 8
    value_weight_cap: 5.0
    max_steps: 3000
    nm_aux_weight: 1.0
    shortcut_suppression: true
    shortcut_margin: 0.3
    shortcut_lambda: 2.0
    memory_dropout: 0.0
