# 诊断 v11:用 v10 数据规模 (1000 ep) 跑 50 步 + log_every=1
base: qwen3.5-0.8b.yaml
curriculum_file: curriculum_pcap_skeleton_gen_v11_diag.yaml

state:
  n_persistent_per_layer: 0

lora:
  rank: 4

training:
  grad_accum_steps: 4
  dtype: bfloat16
  compile_backbone_layers: false

stage_overrides:
  pcap_skeleton:
    learning_rate: 3.0e-4
    warmup_steps: 100
    weight_decay: 0.1
    batch_size: 1
    grad_accum_steps: 2
    turn_max_tokens: 256
    max_turns_per_episode: 8
    tbptt_turns: 8
    value_weight_cap: 5.0
    max_steps: 50
    nm_aux_weight: 1.0
    shortcut_suppression: true
    shortcut_margin: 0.3
    shortcut_lambda: 2.0
    memory_dropout: 0.0
