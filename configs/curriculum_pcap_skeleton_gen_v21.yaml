# v21 curriculum = v20 curriculum,唯一改 max_steps 14000 → 40000(schedule horizon)。
# num_train=2000 / seed=42 与 v20 完全一致 → resume from xinhe_step_14000.pt 实体集连续。
# train/val dict_split 完全分离(实测 value 重叠 0/315)。
training_defaults:
  learning_rate: 3.0e-4
  grad_clip: 1.0
  gradient_checkpointing: false
  log_every: 50
  eval_every: 1000
  save_every: 1000

stages:
  - name: "pcap_skeleton"
    data:
      kind: "mix_dynamic"
      sources:
        - {path: "data/skeleton/train.jsonl", ratio: 1.0, tag: "skeleton"}
      val_sources:
        - {path: "data/skeleton/val.jsonl",   ratio: 1.0, tag: "skeleton"}
      num_train: 2000
      num_val: 200
      seed: 42
    training:
      max_turns_per_episode: 8
      turn_max_tokens: 256
      plugin_lr_multiplier: 1.0
      value_weight_cap: 5.0
      per_segment_checkpoint: false
      max_steps: 40000
      warmup_steps: 200
      weight_decay: 0.1
      use_joint_early_stop: false
    val_sets:
      - {name: "skeleton_val", path: "data/skeleton/val.jsonl"}
