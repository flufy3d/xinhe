# v9 真泛化 curriculum:train.jsonl 2000 ep + 10000 步 = 5 visits/ep
# train 和 val 完全分离(train.jsonl vs val.jsonl)。这才是"聊天时记新事"的真测试。
training_defaults:
  learning_rate: 3.0e-4
  grad_clip: 1.0
  gradient_checkpointing: false
  log_every: 50
  eval_every: 1000
  save_every: 1000

stages:
  - name: "pcap_skeleton"
    data:
      kind: "mix_dynamic"
      sources:
        - {path: "data/skeleton/train.jsonl", ratio: 1.0, tag: "skeleton"}
      val_sources:
        - {path: "data/skeleton/val.jsonl",   ratio: 1.0, tag: "skeleton"}
      num_train: 2000
      num_val: 200
      seed: 42
    training:
      max_turns_per_episode: 8
      turn_max_tokens: 256
      plugin_lr_multiplier: 1.0
      value_weight_cap: 5.0
      per_segment_checkpoint: false
      max_steps: 10000
      warmup_steps: 200
      weight_decay: 0.1
      use_joint_early_stop: false
    val_sets:
      - {name: "skeleton_val", path: "data/skeleton/val.jsonl"}
